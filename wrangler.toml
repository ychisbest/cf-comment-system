name = "cf-comment-system"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# 静态资源：widget.js 与后台页面（由 npm run build:widget 生成到 public/）
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "comments"
database_id = "REPLACE_WITH_D1_DATABASE_ID"   # wrangler d1 create comments 后填入
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "comments-images"

# 每 10 分钟：发送邮件队列、清理未引用上传与过期限流计数
[triggers]
crons = ["*/10 * * * *"]

[vars]
# Turnstile 站点密钥（公开）。下面是官方"总是通过"的测试 key，上线前换成真实的。
TURNSTILE_SITEKEY = "1x00000000000000000000AA"
# Resend 发信地址（需已验证域名）
EMAIL_FROM = "Comments <noreply@example.com>"
# Worker 对外地址，用于邮件中的退订链接
PUBLIC_BASE_URL = "https://comments.example.com"
# 限流：每个 ip_hash 的 "每分钟/每小时/每天" 上限
RATE_COMMENT = "3/20/100"
RATE_UPLOAD = "3/20/50"
RATE_VOTE = "20/200/1000"
# 每天最多发送的通知邮件数（Resend 免费额度）
EMAIL_DAILY_LIMIT = "90"

# 以下 secret 用 wrangler secret put 设置，不要写在这里：
#   ADMIN_TOKEN, TURNSTILE_SECRET, RESEND_API_KEY, IP_SALT
